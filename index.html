<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1a1a1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="ਕਿਰਾਇਆ"/>
<title>ਕਿਰਾਇਆ ਬਿਲਿੰਗ ਕੈਲਕੁਲੇਟਰ</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./icon-192.png"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }
.topbar { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.topbar h1 { font-size: 17px; font-weight: 500; }
.topbar span { font-size: 12px; color: #888; }
.container { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
.tab-bar { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid #e0e0da; }
.tab { padding: 9px 18px; font-size: 13px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 500; }
.panel { display: none; }
.panel.active { display: block; }
.section-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
input[type=text], input[type=number], input[type=date], select {
  height: 34px; padding: 0 10px; font-size: 13px;
  border: 1px solid #ddd; border-radius: 8px;
  background: #fff; color: #1a1a1a; width: 100%; font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: #888; }
input[type=number] { -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
.btn { height: 32px; padding: 0 14px; font-size: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a; cursor: pointer; font-family: inherit; }
.btn:hover { background: #f5f5f3; }
.btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-danger { color: #c0392b; }
.btn-danger:hover { background: #fdf0f0; border-color: #e0a0a0; }
.del-btn { width: 28px; height: 28px; border: none; background: none; color: #aaa; cursor: pointer; font-size: 18px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.del-btn:hover { background: #fdf0f0; color: #c0392b; }
.card { background: #fff; border: 1px solid #e5e5e0; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
.customer-name-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.customer-name-row input { font-weight: 500; font-size: 14px; }
.payment-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: #666; }
.payment-date-row input { width: 170px; }
.event-hdr { display: grid; grid-template-columns: 90px minmax(0,2fr) 60px minmax(0,1fr) 28px; gap: 5px; margin-bottom: 4px; }
.event-hdr span { font-size: 11px; color: #999; }
.event-row { display: grid; grid-template-columns: 90px minmax(0,2fr) 60px minmax(0,1fr) 28px; gap: 5px; align-items: center; margin-bottom: 5px; }
.add-event-row { display: flex; gap: 8px; margin-top: 8px; }
.empty { color: #aaa; font-size: 13px; text-align: center; padding: 2.5rem 0; }
.summary-cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 20px; }
.scard { background: #fff; border: 1px solid #e5e5e0; border-radius: 10px; padding: 14px 16px; }
.scard .lbl { font-size: 11px; color: #888; margin-bottom: 5px; }
.scard .val { font-size: 22px; font-weight: 500; }
.bill-customer-total { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.bill-customer-name { font-size: 15px; font-weight: 500; }
.bill-pay-date { font-size: 11px; color: #888; margin-top: 2px; }
.badge-total { font-size: 13px; font-weight: 600; color: #1a6ef5; background: #eaf0ff; padding: 3px 12px; border-radius: 20px; }
.bill-mat-name { font-size: 13px; font-weight: 500; margin-bottom: 5px; color: #333; }
.bill-seg-row { display: grid; grid-template-columns: minmax(0,2.5fr) 40px 40px 40px 40px minmax(0,1fr); gap: 4px; font-size: 12px; padding: 3px 0; }
.bill-seg-row.hdr { color: #999; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 3px; }
.bill-seg-row span:not(:first-child) { text-align: right; }
.bill-mat-section { margin-bottom: 12px; }
.bill-divider { border: none; border-top: 1px solid #eee; margin: 10px 0; }
.bill-total-row { display: flex; justify-content: flex-end; font-size: 14px; font-weight: 600; border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; }
.bill-seg-row.missing-row { background: #fff3e0; border-radius: 6px; padding-left: 4px; padding-right: 4px; }
.bill-seg-row.excess-row { background: #fffde7; border-radius: 6px; padding-left: 4px; padding-right: 4px; color: #f57f17; }
.excess-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: #f57f17; background: #fff9c4; border-radius: 4px; padding: 1px 5px; margin-top: 2px; }
.bill-seg-row.returned-row { background: #f0faf4; border-radius: 6px; padding-left: 4px; padding-right: 4px; color: #27ae60; }
.missing-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: #e65100; background: #ffe0b2; border-radius: 4px; padding: 1px 5px; margin-top: 2px; }
.mat-missing-note { font-size: 11px; color: #e65100; background: #fff3e0; border: 1px solid #ffcc80; border-radius: 6px; padding: 4px 8px; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
.mat-row { display: grid; grid-template-columns: minmax(0,2fr) 110px 28px; gap: 8px; align-items: center; margin-bottom: 6px; }
.top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.print-btn { display: flex; align-items: center; gap: 6px; }

/* Install banner */
#install-banner { display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 999; }
#install-banner button { background: #fff; color: #1a1a1a; border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-weight: 500; }
#install-banner .dismiss { background: transparent; color: #aaa; padding: 5px; }

@media print {
  .topbar, .tab-bar, .top-actions, .add-event-row, .del-btn, .btn, .customer-name-row button, #install-banner { display: none !important; }
  body { background: #fff; }
  .panel { display: block !important; }
  #panel-orders, #panel-materials { display: none !important; }
  .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
}
@media (max-width: 600px) {
  .summary-cards { grid-template-columns: repeat(2, 1fr); }
  .event-hdr, .event-row { grid-template-columns: 80px minmax(0,1.5fr) 50px minmax(0,1fr) 28px; }
  .bill-seg-row { grid-template-columns: minmax(0,2fr) 30px 30px 30px 30px minmax(0,1fr); font-size: 11px; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>ਕਿਰਾਇਆ ਬਿਲਿੰਗ ਕੈਲਕੁਲੇਟਰ</h1>
  <span>ਬਿਲਡਿੰਗ ਮਟੀਰੀਅਲ ਕਿਰਾਇਆ</span>
</div>

<div class="container">
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('orders')">ਗਾਹਕ ਆਰਡਰ</button>
    <button class="tab" onclick="switchTab('bills')">ਬਿੱਲ</button>
    <button class="tab" onclick="switchTab('materials')">ਮਟੀਰੀਅਲ</button>
  </div>

  <!-- ORDERS -->
  <div class="panel active" id="panel-orders">
    <div class="top-actions">
      <p class="section-label" style="margin:0">ਆਰਡਰ</p>
      <button class="btn btn-primary" onclick="addOrder()">+ ਨਵਾਂ ਗਾਹਕ</button>
    </div>
    <div id="order-list"></div>
  </div>

  <!-- BILLS -->
  <div class="panel" id="panel-bills">
    <div class="top-actions">
      <p class="section-label" style="margin:0">ਬਿੱਲ</p>
      <button class="btn" onclick="window.print()">🖨 ਬਿੱਲ ਛਾਪੋ</button>
    </div>
    <div class="summary-cards">
      <div class="scard"><div class="lbl">ਗਾਹਕ</div><div class="val" id="s-orders">0</div></div>
      <div class="scard"><div class="lbl">ਕੁੱਲ ਦਿਨ</div><div class="val" id="s-days">0</div></div>
      <div class="scard"><div class="lbl">ਕੁੱਲ ਰਕਮ</div><div class="val" id="s-amount">₹0</div></div>
    </div>
    <div id="bills-list"></div>
  </div>

  <!-- MATERIALS -->
  <div class="panel" id="panel-materials">
    <p class="section-label">ਮਟੀਰੀਅਲ ਅਤੇ ਰੋਜ਼ਾਨਾ ਰੇਟ</p>
    <div style="display:grid;grid-template-columns:minmax(0,2fr) 110px 28px;gap:8px;margin-bottom:6px;">
      <span style="font-size:11px;color:#999;">ਨਾਮ</span>
      <span style="font-size:11px;color:#999;">₹ ਪ੍ਰਤੀ ਦਿਨ</span>
      <span></span>
    </div>
    <div id="mat-list"></div>
    <button class="btn" onclick="addMaterial()" style="margin-top:10px;">+ ਮਟੀਰੀਅਲ ਜੋੜੋ</button>
  </div>
</div>

<!-- PWA install prompt -->
<div id="install-banner">
  <span>📲 ਐਪ ਇੰਸਟਾਲ ਕਰੋ</span>
  <button onclick="installApp()">ਇੰਸਟਾਲ</button>
  <button class="dismiss" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
</div>

<script>
let matIdC = 10, orderIdC = 1;
let materials = [
  { id:1, name:'ਪਲੇਟ',    rate:2 },
  { id:2, name:'ਸਪੋਰਟ',   rate:2 },
  { id:3, name:'ਗੌਡਰ',    rate:3 },
  { id:4, name:'ਚੈਨਰ',    rate:2 },
  { id:5, name:'ਫੱਟੇ',    rate:1 },
  { id:6, name:'ਚਿੱਲੀਆ', rate:10 },
];
let orders = [];

function save() {
  try { localStorage.setItem('rental_materials', JSON.stringify(materials)); localStorage.setItem('rental_orders', JSON.stringify(orders)); localStorage.setItem('rental_idc', JSON.stringify({matIdC, orderIdC})); } catch(e){}
}
function load() {
  try {
    const m = localStorage.getItem('rental_materials'); if(m) materials = JSON.parse(m);
    const o = localStorage.getItem('rental_orders'); if(o) orders = JSON.parse(o);
    const c = localStorage.getItem('rental_idc'); if(c) { const x=JSON.parse(c); matIdC=x.matIdC; orderIdC=x.orderIdC; }
  } catch(e){}
  // Migrate old English names to Punjabi by ID
  const nameMap = {1:'ਪਲੇਟ', 2:'ਸਪੋਰਟ', 3:'ਗੌਡਰ', 4:'ਚੈਨਰ', 5:'ਫੱਟੇ', 6:'ਚਿੱਲੀਆ'};
  const englishNames = ['Plate','Support','Gauder','Channer','Fatte','Chillia'];
  materials.forEach(m => { if(nameMap[m.id] && englishNames.includes(m.name)) m.name = nameMap[m.id]; });
  save();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['orders','bills','materials'][i]===tab));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', ['panel-orders','panel-bills','panel-materials'][i]==='panel-'+tab));
  if(tab==='bills') renderBills();
  if(tab==='materials') renderMaterials();
}

function matOptions(selId) {
  return materials.map(m=>`<option value="${m.id}" ${m.id==selId?'selected':''}>${m.name} (₹${m.rate}/ਦਿਨ)</option>`).join('');
}

// MATERIALS
function renderMaterials() {
  document.getElementById('mat-list').innerHTML = materials.map(m=>`
    <div class="mat-row">
      <input type="text" value="${m.name}" oninput="updateMat(${m.id},'name',this.value)" placeholder="ਮਟੀਰੀਅਲ ਦਾ ਨਾਮ"/>
      <input type="number" value="${m.rate}" oninput="updateMat(${m.id},'rate',this.value)" placeholder="ਰੇਟ ₹/ਦਿਨ"/>
      <button class="del-btn" onclick="deleteMat(${m.id})">×</button>
    </div>`).join('');
}
function addMaterial() { materials.push({id:matIdC++,name:'',rate:0}); save(); renderMaterials(); }
function updateMat(id,field,val) { const m=materials.find(x=>x.id===id); if(m){m[field]=field==='rate'?parseFloat(val)||0:val;} save(); }
function deleteMat(id) { materials=materials.filter(x=>x.id!==id); save(); renderMaterials(); }

// ORDERS
function addOrder() {
  const today = new Date().toISOString().split('T')[0];
  orders.push({ id:orderIdC++, customer:'', paymentDate:today, events:[{id:1,type:'rent',matId:materials[0]?.id,qty:1,date:''}], evIdC:2 });
  save(); renderOrders();
}
function updateOrder(id,field,val) { const o=orders.find(x=>x.id===id); if(o) o[field]=val; save(); if(field==='paymentDate') renderOrders(); }
function deleteOrder(id) { if(!confirm('ਕੀ ਇਸ ਗਾਹਕ ਨੂੰ ਹਟਾਉਣਾ ਹੈ?')) return; orders=orders.filter(x=>x.id!==id); save(); renderOrders(); }
function addEvent(orderId,type) { const o=orders.find(x=>x.id===orderId); if(!o) return; o.events.push({id:o.evIdC++,type,matId:materials[0]?.id,qty:1,date:''}); save(); renderOrders(); }
function deleteEvent(orderId,evId) { const o=orders.find(x=>x.id===orderId); if(o) o.events=o.events.filter(e=>e.id!==evId); save(); renderOrders(); }
function updateEvent(orderId,evId,field,val) {
  const o=orders.find(x=>x.id===orderId); if(!o) return;
  const ev=o.events.find(e=>e.id===evId); if(!ev) return;
  ev[field]=field==='qty'?parseInt(val)||1:(field==='matId'?parseInt(val):val);
  save(); renderOrders();
}

function renderOrders() {
  const el=document.getElementById('order-list');
  if(!orders.length){el.innerHTML='<p class="empty">ਅਜੇ ਕੋਈ ਗਾਹਕ ਨਹੀਂ। ਸ਼ੁਰੂ ਕਰਨ ਲਈ "+ ਨਵਾਂ ਗਾਹਕ" ਦਬਾਓ।</p>';return;}
  el.innerHTML=orders.map(o=>`
    <div class="card">
      <div class="customer-name-row">
        <input type="text" value="${o.customer}" oninput="updateOrder(${o.id},'customer',this.value)" placeholder="ਗਾਹਕ ਦਾ ਨਾਮ" style="font-size:14px;font-weight:500;"/>
        <button class="del-btn btn-danger" onclick="deleteOrder(${o.id})">×</button>
      </div>
      <div class="payment-date-row">
        <span>ਭੁਗਤਾਨ ਤਾਰੀਖ:</span>
        <input type="date" value="${o.paymentDate}" onchange="updateOrder(${o.id},'paymentDate',this.value)" style="width:170px;"/>
      </div>
      <div class="event-hdr">
        <span>ਕਿਸਮ</span><span>ਮਟੀਰੀਅਲ</span><span>ਮਾਤਰਾ</span><span>ਤਾਰੀਖ</span><span></span>
      </div>
      ${o.events.map(ev=>`
        <div class="event-row">
          <select onchange="updateEvent(${o.id},${ev.id},'type',this.value)">
            <option value="rent" ${ev.type==='rent'?'selected':''}>ਲਗਾਇਆ</option>
            <option value="return" ${ev.type==='return'?'selected':''}>ਜਮਾ</option>
          </select>
          <select onchange="updateEvent(${o.id},${ev.id},'matId',this.value)">${matOptions(ev.matId)}</select>
          <input type="number" value="${ev.qty}" min="1" onfocus="this.select()" onchange="updateEvent(${o.id},${ev.id},'qty',this.value)"/>
          <input type="date" value="${ev.date}" onchange="updateEvent(${o.id},${ev.id},'date',this.value)"/>
          <button class="del-btn" onclick="deleteEvent(${o.id},${ev.id})">×</button>
        </div>`).join('')}
      <div class="add-event-row">
        <button class="btn" onclick="addEvent(${o.id},'rent')">+ ਲਗਾਇਆ</button>
        <button class="btn" onclick="addEvent(${o.id},'return')">+ ਜਮਾ</button>
      </div>
    </div>`).join('');
}

// BILLING
function calcOrder(o) {
  if(!o.paymentDate) return {allSegments:[],grandTotal:0,totalDays:0};
  const payDate=new Date(o.paymentDate);
  const matIds=[...new Set(o.events.map(e=>e.matId))];
  let allSegments=[],grandTotal=0,totalDays=0;
  matIds.forEach(matId=>{
    const mat=materials.find(m=>m.id===matId); if(!mat) return;
    const evs=o.events.filter(e=>e.matId===matId&&e.date).sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(!evs.length) return;
    let runningQty=0, segments=[];
    for(let i=0;i<evs.length;i++){
      const ev=evs[i];
      const fromDate=new Date(ev.date);
      const toDate=i+1<evs.length?new Date(evs[i+1].date):payDate;
      if(ev.type==='rent') runningQty+=ev.qty;
      else if(ev.type==='return') { const excess=ev.qty>runningQty; runningQty=Math.max(0,runningQty-ev.qty); if(excess) { segments.push({mat,type:ev.type,qty:ev.qty,runningQty,from:ev.date,to:i+1<evs.length?evs[i+1].date:o.paymentDate,days:0,amount:0,missing:false,excess:true}); continue; } }
      const days=Math.max(0,Math.round((toDate-fromDate)/86400000));
      const amount=runningQty*days*mat.rate;
      const isLast=(i===evs.length-1);
      const missing=isLast&&runningQty>0;
      grandTotal+=amount; totalDays+=runningQty*days;
      segments.push({mat,type:ev.type,qty:ev.qty,runningQty,from:ev.date,to:i+1<evs.length?evs[i+1].date:o.paymentDate,days,amount,missing});
    }
    allSegments.push({mat,segments});
  });
  return {allSegments,grandTotal,totalDays};
}

function fmt(d){if(!d)return'—';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}

function renderBills(){
  const el=document.getElementById('bills-list');
  if(!orders.length){el.innerHTML='<p class="empty">ਅਜੇ ਕੋਈ ਆਰਡਰ ਨਹੀਂ।</p>';updateSummary(0,0,0);return;}
  let grandTotal=0,grandDays=0;
  el.innerHTML=orders.map(o=>{
    const {allSegments,grandTotal:ot,totalDays:od}=calcOrder(o);
    grandTotal+=ot||0; grandDays+=od||0;
    if(!allSegments||!allSegments.length) return `<div class="card"><div class="bill-customer-total"><span class="bill-customer-name">${o.customer||'ਅਣਜਾਣ'}</span><span class="badge-total">₹0</span></div><p style="font-size:12px;color:#aaa;">ਕੋਈ ਵੈਧ ਇਵੈਂਟ ਨਹੀਂ।</p></div>`;
    const missingItems = allSegments.flatMap(({mat,segments}) =>
      segments.filter(s=>s.missing).map(s=>({mat, qty:s.runningQty}))
    );
    return `<div class="card">
      <div class="bill-customer-total">
        <div>
          <div class="bill-customer-name">${o.customer||'ਅਣਜਾਣ'}</div>
          <div class="bill-pay-date">ਭੁਗਤਾਨ ਤਾਰੀਖ: ${fmt(o.paymentDate)}</div>
        </div>
        <span class="badge-total">₹${(ot||0).toLocaleString('en-IN')}</span>
      </div>
      ${allSegments.map(({mat,segments},i)=>`
        ${i>0?'<hr class="bill-divider"/>':''}
        <div class="bill-mat-section">
          <div class="bill-mat-name">${mat.name} — ₹${mat.rate}/ਦਿਨ</div>
          <div class="bill-seg-row hdr"><span>ਮਿਆਦ</span><span>ਮਾਤਰਾ</span><span>ਜਮਾ</span><span>ਦਿਨ</span><span>ਰੇਟ</span><span>ਰਕਮ</span></div>
          ${segments.filter(s => s.runningQty > 0 || s.type === 'return' || s.excess).map(s => {
            if (s.excess) return `
              <div class="bill-seg-row excess-row">
                <span>${fmt(s.from)} → <b>ਵੱਧ ਜਮਾ</b></span>
                <span>0</span>
                <span style="font-weight:600;">${s.qty}</span>
                <span>—</span>
                <span>—</span>
                <span><span class="excess-badge">⚠ ਵੱਧ ਜਮਾ</span></span>
              </div>`;
            const isFullReturn = s.type === 'return' && s.runningQty === 0;
            if (isFullReturn) return `
              <div class="bill-seg-row returned-row">
                <span>${fmt(s.from)} → ✓ ਸਭ ਜਮਾ</span>
                <span>0</span>
                <span style="font-weight:600;color:#27ae60;">${s.qty}</span>
                <span>—</span>
                <span>—</span>
                <span style="font-weight:600;">₹0</span>
              </div>`;
            if (s.missing) return `
              <div class="bill-seg-row missing-row">
                <span>${fmt(s.from)} → <b style="color:#e65100">ਜਮਾ ਨਹੀਂ</b></span>
                <span>${s.runningQty}</span>
                <span style="color:${s.type==='return'?'#27ae60':'#ccc'}">${s.type==='return'?s.qty:'—'}</span>
                <span>—</span>
                <span>₹${mat.rate}</span>
                <span><span class="missing-badge">⚠ ਗੁੰਮ</span></span>
              </div>`;
            return `
              <div class="bill-seg-row">
                <span>${fmt(s.from)} → ${fmt(s.to)}</span>
                <span>${s.runningQty}</span>
                <span style="color:${s.type==='return'?'#27ae60':'#ccc'}">${s.type==='return'?s.qty:'—'}</span>
                <span>${s.days}</span>
                <span>₹${mat.rate}</span>
                <span style="font-weight:600;">₹${s.amount.toLocaleString('en-IN')}</span>
              </div>`;
          }).join('')}
          ${segments.some(s=>s.excess)?`<div class="mat-missing-note" style="color:#f57f17;background:#fffde7;border-color:#ffe082;">⚠ ${mat.name} — ਲਗਾਏ ਨਾਲੋਂ ਵੱਧ ਜਮਾ ਕੀਤੇ</div>`:''}
        </div>`).join('')}
      <div class="bill-total-row">ਕੁੱਲ: ₹${(ot||0).toLocaleString('en-IN')}</div>
      ${missingItems.length ? `
        <div style="margin-top:12px;border:1px solid #ffcc80;border-radius:8px;padding:10px 14px;background:#fff8f0;">
          <div style="font-size:11px;font-weight:600;color:#e65100;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">⚠ ਜਮਾ ਨਾ ਹੋਏ ਆਈਟਮ</div>
          ${missingItems.map(({mat,qty})=>`
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px solid #ffe0b2;">
              <span style="color:#333;">${mat.name} — ${qty} ਆਈਟਮ ਜਮਾ ਨਹੀਂ</span>
              <span style="font-weight:600;color:#e65100;">₹${(qty * mat.rate).toLocaleString('en-IN')}/ਦਿਨ</span>
            </div>`).join('')}
          <div style="font-size:11px;color:#999;margin-top:6px;">* ਇਹ ਰਕਮ ਉੱਪਰਲੇ ਕੁੱਲ ਵਿੱਚ ਸ਼ਾਮਲ ਨਹੀਂ ਹੈ</div>
        </div>` : ''}
    </div>`;
  }).join('');
  updateSummary(orders.length,grandDays,grandTotal);
}

function updateSummary(o,d,a){
  document.getElementById('s-orders').textContent=o;
  document.getElementById('s-days').textContent=d;
  document.getElementById('s-amount').textContent='₹'+a.toLocaleString('en-IN');
}

// ── Service Worker registration ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered, scope:', reg.scope))
      .catch(err => console.warn('SW registration failed:', err));
  });
}

// ── PWA install prompt ───────────────────────────────────────────────────────
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('install-banner').style.display = 'flex';
});
function installApp() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(() => {
    deferredInstallPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
});

load(); renderOrders();
</script>
</body>
</html>
